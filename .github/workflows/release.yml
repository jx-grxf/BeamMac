name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build DMG
        run: BEAMMAC_VERSION="${GITHUB_REF_NAME#v}" script/build_and_run.sh release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/BeamMac-$version.dmg" \
            --title "BeamMac $version" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
