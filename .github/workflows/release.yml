name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    # Signing secrets only reach jobs in this environment.
    environment: release
    env:
      HAS_NOTARY_KEY: ${{ secrets.BEAMMAC_NOTARY_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import signing certificate
        env:
          BEAMMAC_SIGN_P12_BASE64: ${{ secrets.BEAMMAC_SIGN_P12_BASE64 }}
          BEAMMAC_SIGN_P12_PASSWORD: ${{ secrets.BEAMMAC_SIGN_P12_PASSWORD }}
        run: script/import_signing_certificate.sh
      - name: Build DMG
        env:
          BEAMMAC_SIGN_IDENTITY: ${{ secrets.BEAMMAC_SIGN_IDENTITY }}
        run: BEAMMAC_VERSION="${GITHUB_REF_NAME#v}" script/build_and_run.sh release
      - name: Notarize
        if: env.HAS_NOTARY_KEY == 'true'
        env:
          BEAMMAC_NOTARY_KEY_ID: ${{ secrets.BEAMMAC_NOTARY_KEY_ID }}
          BEAMMAC_NOTARY_ISSUER_ID: ${{ secrets.BEAMMAC_NOTARY_ISSUER_ID }}
          BEAMMAC_NOTARY_KEY_P8_BASE64: ${{ secrets.BEAMMAC_NOTARY_KEY_P8_BASE64 }}
        run: script/notarize.sh "dist/BeamMac-${GITHUB_REF_NAME#v}.dmg"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/BeamMac-$version.dmg" \
            --title "BeamMac $version" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
