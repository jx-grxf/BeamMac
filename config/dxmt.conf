# DXMT-Einstellungen für BeamNG bei Starts aus dem Terminal.
# Die App schreibt ihre eigenen Werte nach data/dxmt.conf.

# Frame-Pacing über Metal statt CPU-Limiter: gleichmäßige 60 fps auf dem
# 120-Hz-Display. Auf 120 setzen, wenn die Leistung dafür reicht.
d3d11.preferredMaxFrameRate = 60

# MetalFX multipliziert die Auflösung des Spiels mit diesem Faktor
# (aktiv, solange DXMT_METALFX_SPATIAL_SWAPCHAIN=1). Wine läuft ohne
# Retina-Modus, BeamNG rendert also in Punkten (1800x1169 auf einem
# 16"-MacBook-Pro), und 2.0 landet genau bei den 3600x2338 Pixeln des Panels.
d3d11.metalSpatialUpscaleFactor = 2.0

dxgi.handleAltTab = True
