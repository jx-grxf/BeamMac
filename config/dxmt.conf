# DXMT-Einstellungen für BeamNG. Gilt nur für die wine11-Engine.

# Frame-Pacing über Metal statt CPU-Limiter: gleichmäßige 60 fps auf dem
# 120-Hz-Display. Auf 120 setzen, wenn die Leistung dafür reicht.
d3d11.preferredMaxFrameRate = 60

# MetalFX skaliert das Bild vom Spiel hoch (aktiv, solange
# DXMT_METALFX_SPATIAL_SWAPCHAIN=1). Mit 1.5 rendert BeamNG bei
# 2016x1309 und landet bei 3024x1964.
d3d11.metalSpatialUpscaleFactor = 1.5

dxgi.handleAltTab = True
